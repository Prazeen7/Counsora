$kind: http-request
name: Commit Import
method: POST
url: '{{base_url}}/institution/import/commit'
order: 4000
description: |-
  Persist the extracted institutions and programs to the database.

  **Requires:** `admin` or `superAdmin` role.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sessionId": "<sessionId>",
      "groupId": "<groupId>",
      "countryId": "{{countryId}}"
    }
